name: Reusable VPS Deploy

on:
  workflow_call:
    inputs:
      target_directory:
        required: true
        type: string
        description: "Path on the VPS where docker-compose.yml lives"
      image_tag:
        required: true
        type: string
        description: "The Docker image tag to deploy"
      env_variable_name:
        required: false
        type: string
        default: "IMAGE_TAG"
        description: "The variable name in the .env file to update"
    secrets:
      VPS_HOST:
        required: true
      VPS_USERNAME:
        required: true
      VPS_SSH_KEY:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Pass variables through envs to prevent shell injection/character issues
          envs: TARGET_DIR_RAW,IMAGE_TAG_RAW,ENV_VAR_RAW
          script: |
            set -e

            # 1. Sanitize Inputs (Trim whitespace/hidden characters)
            TARGET_DIR=$(echo "${{ inputs.target_directory }}" | xargs)
            IMAGE_TAG=$(echo "${{ inputs.image_tag }}" | xargs)
            ENV_VAR=$(echo "${{ inputs.env_variable_name }}" | xargs)

            echo "--- SANITY CHECK ---"
            echo "Current User: $(whoami)"
            echo "Working Dir:  $(pwd)"
            echo "Target Dir:   $TARGET_DIR"
            
            # 2. Robust Directory Navigation
            if [ -d "$TARGET_DIR" ]; then
              cd "$TARGET_DIR"
              echo "Successfully moved to: $(pwd)"
            else
              echo "ERROR: Directory not found: $TARGET_DIR"
              echo "Listing contents of $(pwd) for debugging:"
              ls -la
              echo "Checking if parent directory exists:"
              ls -d "${TARGET_DIR%/*}" || echo "Parent directory also missing."
              exit 1
            fi

            # 3. Update .env file (Robust Update/Append)
            if [ ! -f .env ]; then
              echo "ERROR: .env file missing in $(pwd). Creating an empty one."
              touch .env
            fi

            echo "Updating .env: $ENV_VAR=$IMAGE_TAG"
            if grep -q "^${ENV_VAR}=" .env; then
              sed -i "s|^${ENV_VAR}=.*|${ENV_VAR}=${IMAGE_TAG}|" .env
            else
              echo "${ENV_VAR}=${IMAGE_TAG}" >> .env
            fi
            
            # 4. Docker Operations
            echo "Pulling images..."
            docker compose pull
            
            echo "Starting containers..."
            docker compose up -d --remove-orphans

            # 5. Optimized Healthcheck Wait
            echo "Waiting for services to become healthy..."
            TIMEOUT=60
            INTERVAL=5
            while [ $TIMEOUT -gt 0 ]; do
              # Get status in JSON for reliable parsing
              STATUS=$(docker compose ps --format json)
              
              # Count how many have healthchecks and are healthy
              # Note: Some containers might not have healthchecks defined
              HEALTHY_COUNT=$(echo "$STATUS" | grep -c '"Health":"healthy"' || true)
              STARTING_COUNT=$(echo "$STATUS" | grep -c '"Health":"starting"' || true)
              UNHEALTHY_COUNT=$(echo "$STATUS" | grep -c '"Health":"unhealthy"' || true)
              
              if [ "$UNHEALTHY_COUNT" -gt 0 ]; then
                echo "FAIL: One or more containers are UNHEALTHY."
                docker compose logs --tail=20
                exit 1
              fi

              if [ "$HEALTHY_COUNT" -gt 0 ] && [ "$STARTING_COUNT" -eq 0 ]; then
                echo "Success: Services are healthy and stable!"
                docker compose ps
                exit 0
              fi
              
              echo "Waiting... ($TIMEOUTs left). Healthy: $HEALTHY_COUNT, Starting: $STARTING_COUNT"
              sleep $INTERVAL
              TIMEOUT=$((TIMEOUT - INTERVAL))
            done
            
            echo "ERROR: Healthcheck timed out!"
            docker compose ps
            exit 1

      - name: Notification
        if: always()
        run: |
          echo "Deployment finished with status: ${{ job.status }}"
name: Reusable Docker Build

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
        description: "The name of the image to push to Docker Hub"
      build_context:
        required: false
        type: string
        default: "."
        description: "The directory to use as the Docker build context"
      dockerfile_path:
        required: false
        type: string
        default: "./Dockerfile"
        description: "The path to the Dockerfile relative to the repo root"
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}
          tags: |
            # 1. Tag on semantic version (v1.0.0) from git tags
            type=semver,pattern={{version}}

            # 2. Tag 'latest' ONLY on the default branch (master)
            type=raw,value=latest,enable={{is_default_branch}}

            # 3. Tag with branch name (e.g. 'dev') ONLY on non-default branches
            type=ref,event=branch,enable={{is_not_default_branch}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Optimized GitHub Actions caching
          cache-from: type=gha
          cache-to: type=gha,mode=max
